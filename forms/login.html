<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scents N Stories | Log In Page</title>
    <link rel="stylesheet" href="./Styles/login.css" />
    <link rel="shortcut icon" href="../assets/Favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Helvetica&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="container">
        <div class="left-section">
            <a href="index.html"><img width="300px" style="margin-bottom: 10px;"
                    src="https://cdn.shopify.com/s/files/1/0264/9243/6565/files/Main_Logo_Black_200x60@2x.png?v=1691871483.webp"
                    alt=""></a>
            <p>Log In To Scents N Stories</p>
        </div>
        <div class="right-section">
            <form id="form">
                <input id="email" type="text" placeholder="Email or phone number" />
                <div class="password-container">
                    <input type="password" placeholder="New password" id="password">
                    <i class="fa-regular fa-eye-slash" id="togglePassword"></i>
                </div>
                <button class="login-btn">Log In</button>
            </form>
            <a href="#" class="forgot-link">Forgotten password?</a>
            <hr />
            <a href="./Signup.html" class="create-btn">Create New Account</a>
            <p class="bottom-link"><a href="#">Create a Page</a> for a celebrity, brand or business.</p>
        </div>
    </div>

    <script type="module" src="./JS/login.js"></script>
    <script type="module" src="../Data/data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
